<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="GreeNova SC">
  <title>GreeNova SC</title>
  <!-- Placa clara: el logotipo es de tres verdes y necesita fondo claro para
       leerse igual en la barra de pestañas clara y en la oscura. -->
  <rect width="80" height="80" rx="18" fill="#ffffff"/>
  <g transform="translate(8 8)">
    <!-- Hoja izquierda (verde salvia) -->
    <path fill="#749c8b" d="M6 0h2c10 0 19 8 19 17v47h-5C9 58 0 48 0 33V6a6 6 0 0 1 6-6Z"/>
    <!-- Hoja superior (verde bosque) -->
    <path fill="#346554" d="M17 0h37a10 10 0 0 1 10 10v17c-8 2-16 1-24 0C33 25 24 14 17 0Z"/>
    <!-- Hoja inferior (lima) -->
    <path fill="#9ed28e" d="M30 32h34v20a12 12 0 0 1-12 12H30Z"/>
  </g>
</svg>
